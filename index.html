<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Contact Us | Creative Engineering</title>
  <meta name="description" content="Contact Creative Engineering or visit our website.">
  <style>
    :root {
      color-scheme: light;
      --ink: #111827;
      --muted: #64748b;
      --paper: #f4f7fb;
      --card: #ffffff;
      --green: #16803d;
      --green-dark: #11632f;
      --blue: #1d4ed8;
      --blue-dark: #1e40af;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        radial-gradient(circle at top left, rgba(29,78,216,.10), transparent 36rem),
        var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      width: min(100%, 440px);
      padding: clamp(26px, 7vw, 40px);
      background: var(--card);
      border: 1px solid #e5eaf2;
      border-radius: 26px;
      box-shadow: 0 18px 55px rgba(15, 23, 42, .09);
      text-align: center;
    }
    .mark {
      width: 68px;
      height: 68px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: var(--ink);
      color: white;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -1.5px;
    }
    h1 {
      margin: 0;
      font-size: clamp(27px, 6vw, 34px);
      letter-spacing: -1px;
      line-height: 1.15;
    }
    .intro {
      margin: 12px 0 28px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
    }
    .actions { display: grid; gap: 13px; }
    .action {
      min-height: 76px;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 17px 18px;
      border-radius: 16px;
      color: #fff;
      text-decoration: none;
      text-align: left;
      transition: transform .15s ease, background .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .action:active { transform: scale(.985); }
    .action:focus-visible { outline: 3px solid #94a3b8; outline-offset: 3px; }
    .call { background: var(--green); }
    .call:hover { background: var(--green-dark); }
    .website { background: var(--blue); }
    .website:hover { background: var(--blue-dark); }
    .icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 12px;
      background: rgba(255,255,255,.12);
    }
    .icon svg { width: 22px; height: 22px; }
    .copy { flex: 1; min-width: 0; }
    .label { display: block; font-size: 17px; font-weight: 700; }
    .detail { display: block; margin-top: 4px; font-size: 13px; opacity: .9; overflow-wrap: anywhere; }
    .arrow { font-size: 24px; line-height: 1; opacity: .9; }
    .footer { margin: 24px 0 0; color: #94a3b8; font-size: 12px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">CE</div>
    <h1>Contact Us</h1>
    <p class="intro">How would you like to connect with Creative Engineering?</p>

    <div class="actions">
      <a class="action call" href="tel:+96103499062" aria-label="Call Creative Engineering at +961 03 499 062">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.2 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.11L8.1 9.9a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.84.58 2.8.7A2 2 0 0 1 22 16.92Z"/>
          </svg>
        </span>
        <span class="copy">
          <span class="label">Call Us</span>
          <span class="detail">+961 03 499 062</span>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="action website" href="https://www.creative-eng.com" target="_blank" rel="noopener noreferrer" aria-label="Visit the Creative Engineering website">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"/>
          </svg>
        </span>
        <span class="copy">
          <span class="label">Visit Our Website</span>
          <span class="detail">creative-eng.com</span>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </div>

    <p class="footer">Creative Engineering</p>
  </main>
</body>
</html>
